<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work with me · Parth Agarwal</title>
    <meta name="description" content="Freelance work with Parth Agarwal. Coming soon.">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            background-image: radial-gradient(#f0f0f0 1px, transparent 0);
            background-size: 15px 15px;
            font-family: 'Inter', sans-serif;
            color: #000;
        }
        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 48px 40px;
            background: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05), 0 0 0 1px rgba(0,0,0,0.05);
            width: min(440px, calc(100% - 32px));
        }
        .eyebrow {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            color: #888;
        }
        h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: 32px;
            margin: 0;
        }
        .rule { height: 1px; width: 40px; background: #ddd; }
        p {
            font-size: 14px;
            color: #555;
            margin: 0;
            max-width: 320px;
            line-height: 1.6;
        }
        p a { color: #000; font-weight: 500; text-underline-offset: 3px; }
        .btn-back {
            margin-top: 8px;
            display: inline-block;
            text-decoration: none;
            color: #000;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: border-color 0.2s;
        }
        .btn-back:hover, .btn-back:focus-visible { border-color: #000; }
    </style>
</head>
<body>
    <main class="container">
        <span class="eyebrow">Work with me</span>
        <h1>Under Construction</h1>
        <div class="rule"></div>
        <p>My freelance page is still being built. In the meantime, if you have a project in mind, <a href="mailto:parthagarwal1512@gmail.com">email me</a>.</p>
        <a href="../index.html" id="backHome" class="btn-back">← Return to Visiting Card</a>
    </main>
</body>
</html>
